[project]
name = "content-studio"
version = "0.1.0"
description = "AI multi-agent system that generates production-ready short-form video packages."
authors = [
    { name = "snhzyn", email = "sonhojin1202@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.8.0",
    "anthropic (>=0.84.0,<0.85.0)",
    "dotenv (>=0.9.9,<0.10.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"